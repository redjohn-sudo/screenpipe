# screenpipe — AI that knows everything you've seen, said, or heard
# https://screenpipe.com
name: PR 7335 cloud native benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr7335-cloud-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    name: Native capture / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      GIT_LFS_SKIP_SMUDGE: 1
      SUBJECT_SHA: c369f333f2752bd6e0c243c2d665dafc49b9f21c
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: c369f333f2752bd6e0c243c2d665dafc49b9f21c
          path: source
      - name: Machine identity and native fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          { sw_vers; uname -a; sysctl hw.model hw.ncpu hw.memsize machdep.cpu.brand_string; csrutil status; } > evidence/machine.txt
          git -C source rev-parse HEAD > evidence/source-sha.txt
          git -C harness rev-parse HEAD > evidence/harness-sha.txt
          swiftc -O harness/scripts/cloud-benchmark/Fixture.swift -o fixture
          clang -O2 harness/scripts/cloud-benchmark/sample.c -o sample
          bash source/.github/scripts/macos/wrap-binary-as-app-bundle.sh fixture com.screenpipe.cloudbench.fixture CloudFixture "$PWD/CloudFixture.app"
          sudo bash source/scripts/tcc-grant/tcc-grant.sh grant --app "$PWD/CloudFixture.app" --service accessibility,input-monitoring,screen-recording --adhoc-sign
          PREFLIGHT_ONLY=1 python3 harness/scripts/cloud-benchmark/run.py "$PWD/evidence/preflight" "$PWD/fixture" "$PWD/CloudFixture.app/Contents/MacOS/CloudFixture" "$PWD/sample"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
          shared-key: pr7335-cloud-native-${{ matrix.os }}
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Dependencies
        run: brew install ffmpeg pkg-config || brew list ffmpeg pkg-config
      - name: Build pinned engine
        working-directory: source
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        run: cargo build --locked --profile debug-dev -p screenpipe-engine --bin screenpipe --no-default-features --features redact-onnx-cpu
      - name: Retain exact test executable
        uses: actions/upload-artifact@v4
        with:
          name: pr7335-${{ matrix.os }}-test-binary
          path: source/target/debug-dev/screenpipe
          retention-days: 7
      - name: Grant isolated recorder identity
        run: |
          bash source/.github/scripts/macos/wrap-binary-as-app-bundle.sh source/target/debug-dev/screenpipe com.screenpipe.cloudbench.engine CloudRecorder "$PWD/CloudRecorder.app"
          sudo bash source/scripts/tcc-grant/tcc-grant.sh grant --app "$PWD/CloudRecorder.app" --service accessibility,input-monitoring,screen-recording --adhoc-sign
      - name: Native workload and capture measurements
        timeout-minutes: 45
        run: python3 harness/scripts/cloud-benchmark/run.py "$PWD/evidence/benchmark" "$PWD/CloudRecorder.app/Contents/MacOS/CloudRecorder" "$PWD/CloudFixture.app/Contents/MacOS/CloudFixture" "$PWD/sample"
      - name: Recording policy regression tests
        working-directory: source
        timeout-minutes: 25
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        run: |
          set -o pipefail
          cargo test --locked --profile debug-dev -p screenpipe-engine --lib --no-default-features --features redact-onnx-cpu recording_detail::tests 2>&1 | tee ../evidence/recording-detail-tests.log
          cargo test --locked --profile debug-dev -p screenpipe-engine --lib --no-default-features --features redact-onnx-cpu power:: 2>&1 | tee ../evidence/power-tests.log
      - name: Evidence, including failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7335-${{ matrix.os }}-native-evidence
          path: |
            evidence/*.txt
            evidence/*.log
            evidence/**/machine.txt
            evidence/**/native-preflight.json
            evidence/**/fixture.stdout
            evidence/**/fixture/*.json
            evidence/**/fixture/*.jsonl
            evidence/benchmark/*.json
            evidence/benchmark/*/*.json
            evidence/benchmark/*/*.jsonl
            evidence/benchmark/*/database-snapshot.sqlite
            evidence/benchmark/*/recorder.log
            evidence/benchmark/*/data/db.sqlite
            evidence/benchmark/*/data/**/*.png
            evidence/benchmark/*/data/**/*.jpg
            evidence/benchmark/*/data/**/*.jpeg
            evidence/benchmark/*/data/**/*.webp
          retention-days: 14

# screenpipe — AI that knows everything you've seen, said, or heard
# https://screenpipe.com
name: PR 7335 AppImage permission diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pr7335-appimage-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage-smoke
          run-id: 36506400369
          github-token: ${{ github.token }}
          path: artifact
      - name: Inspect extraction as the smoke test user
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find artifact -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          sha256sum "$appimage"
          mkdir smoke
          cp "$appimage" smoke/screenpipe.AppImage
          docker run --rm -v "$PWD/smoke:/smoke" debian:13-slim bash -euxo pipefail -c '
            useradd -m smoke-user
            chown -R smoke-user:smoke-user /smoke
            cd /smoke
            chmod +x screenpipe.AppImage
            ./screenpipe.AppImage --appimage-extract >/dev/null
            stat -c "%a %U:%G %n" /smoke squashfs-root squashfs-root/AppRun squashfs-root/AppRun.screenpipe-original
            namei -l squashfs-root/AppRun
            find squashfs-root -maxdepth 2 -type d -printf "%m %u:%g %p\n" | head -25
            set +e
            su smoke-user -c "cd /smoke && test -r squashfs-root/AppRun && test -x squashfs-root/AppRun"
            before=$?
            set -e
            echo "ORIGINAL_USER_ACCESS=$before"
            chown -R smoke-user:smoke-user squashfs-root
            su smoke-user -c "cd /smoke && test -r squashfs-root/AppRun && test -x squashfs-root/AppRun"
            echo "AFTER_EXTRACTION_OWNERSHIP_USER_ACCESS=0"
          ' 2>&1 | tee permission-diagnostic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr7335-appimage-permission-diagnostic
          path: permission-diagnostic.log
          retention-days: 14

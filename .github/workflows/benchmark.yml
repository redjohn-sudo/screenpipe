# screenpipe — AI that knows everything you've seen, said, or heard
# https://screenpipe.com
name: PR 7335 AppImage ownership repair validation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pr7335-appimage-ownership-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, arch]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cdfb542d0c5d9fd8d8d1a89b283a75d741e32be6
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage-smoke
          run-id: 36506400369
          github-token: ${{ github.token }}
          path: artifact
      - name: Reuse the exact failed artifact
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find artifact -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          sha256sum "$appimage"
          cp "$appimage" apps/screenpipe-app-tauri/reused-smoke.AppImage
          echo "APPIMAGE=reused-smoke.AppImage" >> "$GITHUB_ENV"
      - name: Smoke AppImage on Debian 13
        if: matrix.distro == 'debian'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/screenpipe-appimage-smoke
          cp "apps/screenpipe-app-tauri/${APPIMAGE}" /tmp/screenpipe-appimage-smoke/screenpipe.AppImage

          # GITHUB_ACTIONS/CI do not cross the container boundary, so
          # telemetry_disabled_by_env() cannot see them. Without this the smoke
          # run reports as a real install and pollutes PostHog retention.
          docker run --rm \
            -e SCREENPIPE_DISABLE_TELEMETRY=1 \
            -v /tmp/screenpipe-appimage-smoke:/smoke \
            debian:trixie \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates \
                dbus \
                dbus-x11 \
                desktop-file-utils \
                libasound2t64 \
                libayatana-appindicator3-1 \
                libgtk-3-0 \
                libpulse0 \
                librsvg2-2 \
                libsecret-1-0 \
                libwebkit2gtk-4.1-0 \
                libxdo3 \
                libxtst6 \
                xauth \
                xdg-utils \
                xvfb

              useradd -m smoke-user
              chown -R smoke-user:smoke-user /smoke
              install -d -m 700 -o smoke-user -g smoke-user /tmp/screenpipe-runtime
              cd /smoke
              chmod +x screenpipe.AppImage
              ./screenpipe.AppImage --appimage-extract >/dev/null
              # Extraction creates root-owned 0700 directories. The app runs as
              # smoke-user below, so transfer the extracted tree to that user.
              chown -R smoke-user:smoke-user squashfs-root
              su smoke-user -c "test -r /smoke/squashfs-root/AppRun && test -x /smoke/squashfs-root/AppRun"

              desktop=""
              for candidate in squashfs-root/usr/share/applications/*.desktop; do
                [ -f "${candidate}" ] || continue
                if grep -Eq "^Exec=screenpipe-app-launcher([[:space:]]|$)" "${candidate}"; then
                  desktop="${candidate}"
                  break
                fi
              done
              test -n "${desktop}"
              launcher=squashfs-root/usr/bin/screenpipe-app-launcher
              test -x "${launcher}"
              grep -qx "Exec=screenpipe-app-launcher" "${desktop}"
              grep -qx "unset GST_PLUGIN_SYSTEM_PATH" "${launcher}"
              grep -qx "unset GST_PLUGIN_SYSTEM_PATH_1_0" "${launcher}"
              sh -n "${launcher}"

              launcher_probe=/tmp/screenpipe-launcher-probe
              install -D -m 0755 "${launcher}" "${launcher_probe}/usr/bin/screenpipe-app-launcher"
              ln -s /bin/sh "${launcher_probe}/usr/bin/screenpipe-app"
              launcher_env="$(
                APPDIR="${launcher_probe}" \
                  GST_PLUGIN_SYSTEM_PATH=/poisoned \
                  GST_PLUGIN_SYSTEM_PATH_1_0=/poisoned-1.0 \
                  SCREENPIPE_LAUNCHER_PROBE=preserved \
                  "${launcher_probe}/usr/bin/screenpipe-app-launcher" -c env
              )"
              if grep -q "^GST_PLUGIN_SYSTEM_PATH" <<<"${launcher_env}"; then
                echo "Launcher did not clear the GStreamer system plugin paths"
                exit 1
              fi
              grep -qx "SCREENPIPE_LAUNCHER_PROBE=preserved" <<<"${launcher_env}"

              # GStreamer plugins are intentionally supplied by the host. If a
              # future build bundles any, the launcher policy must be revisited.
              if find squashfs-root \
                \( -type d \( -name gstreamer -o -name gstreamer-1.0 \) \
                -o -type f -name "libgst*.so*" \) -print -quit | grep -q .; then
                echo "Unexpected bundled GStreamer plugins or plugin directory"
                exit 1
              fi

              export LD_LIBRARY_PATH=/smoke/squashfs-root/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
              squashfs-root/usr/bin/ffmpeg -version
              squashfs-root/usr/bin/ffprobe -version
              squashfs-root/usr/bin/tesseract --version
              env -u LD_LIBRARY_PATH squashfs-root/usr/bin/bun --version

              check_ldd() {
                local target="$1"
                local output="$2"

                set +e
                ldd "${target}" > "${output}" 2>&1
                local status="$?"
                set -e

                cat "${output}"
                if [ "${status}" -ne 0 ] && ! grep -qi "not a dynamic executable" "${output}"; then
                  return "${status}"
                fi
              }

              check_ldd squashfs-root/usr/bin/ffmpeg /tmp/ffmpeg.ldd
              check_ldd squashfs-root/usr/bin/ffprobe /tmp/ffprobe.ldd
              check_ldd squashfs-root/usr/bin/tesseract /tmp/tesseract.ldd
              # OpenBLAS is bundled by bundle-appimage-runtime-deps.sh because OCR
              # needs it and Debian does not install it by default. This container
              # deliberately does not install libopenblas0, so a missing bundle is a
              # hard failure here rather than something the host quietly satisfies.
              if [ ! -e squashfs-root/usr/lib/libopenblas.so.0 ]; then
                echo "::error::libopenblas.so.0 is not bundled in the AppImage; OCR breaks on hosts without the system package"
                exit 1
              fi
              if [ ! -e squashfs-root/usr/lib/libgfortran.so.5 ]; then
                echo "::error::libgfortran.so.5 is not bundled in the AppImage; the app fails startup on minimal Linux hosts"
                exit 1
              fi
              check_ldd squashfs-root/usr/lib/libopenblas.so.0 /tmp/openblas.ldd
              if grep -R "not found" /tmp/ffmpeg.ldd /tmp/ffprobe.ldd /tmp/tesseract.ldd /tmp/openblas.ldd 2>/dev/null; then
                exit 1
              fi

              find squashfs-root/usr/bin -maxdepth 1 -type f -executable -print
              app_bin=squashfs-root/usr/bin/screenpipe-app
              test -x "${app_bin}"
              check_ldd "${app_bin}" /tmp/app.ldd
              if grep -q "not found" /tmp/app.ldd; then
                exit 1
              fi

              app_ld_library_path="${LD_LIBRARY_PATH}"
              unset LD_LIBRARY_PATH

              set +e
              su smoke-user -c "cd /smoke && export XDG_RUNTIME_DIR=/tmp/screenpipe-runtime && export SCREENPIPE_E2E_SEED=onboarding,no-recording && timeout 20 dbus-run-session -- xvfb-run -a env LD_LIBRARY_PATH=\"${app_ld_library_path}\" squashfs-root/AppRun --help" 2>&1 | tee /tmp/apprun.log
              status="${PIPESTATUS[0]}"
              set -e
              if [ "${status}" != "0" ] && [ "${status}" != "124" ]; then
                echo "AppRun failed with status ${status}"
                exit "${status}"
              fi
              if grep -E "Pi background install failed|bun version: unknown .*SIGSEGV|killed by signal 11" /tmp/apprun.log; then
                echo "AppRun logged a Pi/bun runtime failure"
                exit 1
              fi
            '

      - name: Smoke AppImage on Arch (newer libavif regression)
        if: matrix.distro == 'arch'
        shell: bash
        run: |
          set -euxo pipefail
          # Arch is rolling and ships a newer libavif than the Ubuntu 24.04 build
          # host. This reproduces the Discord report where a stale *bundled*
          # libsharpyuv shadowed the host one and the host libavif.so.16 died with
          # "undefined symbol: SharpYuvConvertWithOptions". The repacked AppImage
          # must launch here.
          mkdir -p /tmp/screenpipe-appimage-arch
          cp "apps/screenpipe-app-tauri/${APPIMAGE}" /tmp/screenpipe-appimage-arch/screenpipe.AppImage
          cp .github/scripts/linux/pipewire-context-smoke.c /tmp/screenpipe-appimage-arch/

          # See the Debian smoke step: the container does not inherit
          # GITHUB_ACTIONS/CI, so telemetry must be disabled explicitly.
          docker run --rm \
            -e SCREENPIPE_DISABLE_TELEMETRY=1 \
            -v /tmp/screenpipe-appimage-arch:/smoke \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Sy --noconfirm --needed \
                gtk3 \
                webkit2gtk-4.1 \
                libavif \
                openblas \
                alsa-lib \
                libpulse \
                librsvg \
                libsecret \
                libayatana-appindicator \
                libxtst \
                xdotool \
                pipewire \
                gcc \
                pkgconf \
                dbus \
                xorg-server-xvfb \
                xorg-xauth \
                ttf-dejavu

              # Prove the host ships a newer libavif/libsharpyuv pair (the trigger).
              pacman -Q libavif libsharpyuv || true
              ls -l /usr/lib/libavif.so.* /usr/lib/libsharpyuv.so.* || true

              # Containers do not boot systemd, which normally creates this.
              # Exercise normal first-launch identity with an owned container ID.
              dbus-uuidgen > /etc/machine-id
              test -s /etc/machine-id

              useradd -m smoke-user
              chown -R smoke-user:smoke-user /smoke
              install -d -m 700 -o smoke-user -g smoke-user /tmp/screenpipe-runtime
              cd /smoke
              chmod +x screenpipe.AppImage
              ./screenpipe.AppImage --appimage-extract >/dev/null
              # Extraction creates root-owned 0700 directories. The app runs as
              # smoke-user below, so transfer the extracted tree to that user.
              chown -R smoke-user:smoke-user squashfs-root
              su smoke-user -c "test -r /smoke/squashfs-root/AppRun && test -x /smoke/squashfs-root/AppRun"

              # The Ubuntu-built PipeWire client must use its matching config,
              # context modules, and SPA support plugins instead of Arch ones.
              spa_dir=/smoke/squashfs-root/usr/lib/spa-0.2
              module_dir=/smoke/squashfs-root/usr/lib/pipewire-0.3
              config=/smoke/squashfs-root/usr/share/pipewire/client.conf
              client=/smoke/squashfs-root/usr/lib/libpipewire-0.3.so.0
              test -f "${client}"
              test -f "${config}"
              test -d "${module_dir}"
              test -f "${spa_dir}/support/libspa-support.so"
              for module in \
                protocol-native client-node client-device adapter metadata session-manager; do
                test -f "${module_dir}/libpipewire-module-${module}.so"
              done
              grep -q "screenpipe coherent bundled PipeWire runtime" squashfs-root/AppRun
              grep -q "SPA_PLUGIN_DIR" squashfs-root/AppRun
              grep -q "PIPEWIRE_MODULE_DIR" squashfs-root/AppRun
              grep -q "PIPEWIRE_CONFIG_NAME" squashfs-root/AppRun

              cc $(pkg-config --cflags libpipewire-0.3) \
                /smoke/pipewire-context-smoke.c \
                -o /tmp/pipewire-context-smoke \
                $(pkg-config --libs libpipewire-0.3)
              LD_LIBRARY_PATH="${module_dir}:/smoke/squashfs-root/usr/lib" \
                SPA_PLUGIN_DIR="${spa_dir}" \
                PIPEWIRE_MODULE_DIR="${module_dir}" \
                PIPEWIRE_CONFIG_NAME="${config}" \
                PIPEWIRE_DEBUG=4 \
                /tmp/pipewire-context-smoke 2>&1 | tee /tmp/pipewire-context.log
              grep -Fxq "PASS pw_main_loop_new" /tmp/pipewire-context.log
              grep -Fxq "PASS pw_context_new" /tmp/pipewire-context.log
              if grep -E "[( :](/usr/lib|/lib)/[^[:space:]]*/pipewire-0\\.3/libpipewire-module-" \
                /tmp/pipewire-context.log; then
                echo "PipeWire context loaded a host module"
                exit 1
              fi
              if grep -E "undefined symbol|could not load mandatory module" /tmp/pipewire-context.log; then
                echo "PipeWire context reported a loader failure"
                exit 1
              fi

              for member in "${module_dir}"/*.so "${spa_dir}"/support/*.so; do
                deps="$(LD_LIBRARY_PATH="${module_dir}:/smoke/squashfs-root/usr/lib" ldd "${member}")"
                printf "%s\n" "${deps}"
                if grep -q "not found" <<<"${deps}"; then
                  exit 1
                fi
                if grep -E "libpipewire-0\\.3\\.so\\.0 => /usr/lib|libpipewire-module-.* => /usr/lib" <<<"${deps}"; then
                  echo "PipeWire runtime member resolved from the Arch host"
                  exit 1
                fi
              done
              client_node="${module_dir}/libpipewire-module-client-node.so"
              if readelf -d "${client_node}" | grep -q "libpipewire-module-protocol-native.so"; then
                LD_LIBRARY_PATH="${module_dir}:/smoke/squashfs-root/usr/lib" \
                  ldd "${client_node}" | \
                  grep -F "libpipewire-module-protocol-native.so => ${module_dir}/libpipewire-module-protocol-native.so"
              fi

              # The fix strips these from the bundle; they must NOT be back.
              if ls squashfs-root/usr/lib/libsharpyuv.so* squashfs-root/usr/lib/libavif.so* 2>/dev/null; then
                echo "bundled libavif/libsharpyuv present - host pair would be shadowed"
                exit 1
              fi

              app_bin=squashfs-root/usr/bin/screenpipe-app
              test -x "${app_bin}"

              app_ld_library_path=/smoke/squashfs-root/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
              unset LD_LIBRARY_PATH
              set +e
              su smoke-user -c "cd /smoke && export XDG_RUNTIME_DIR=/tmp/screenpipe-runtime && export SCREENPIPE_E2E_SEED=onboarding,no-recording && timeout 20 dbus-run-session -- xvfb-run -a env LD_LIBRARY_PATH=\"${app_ld_library_path}\" squashfs-root/AppRun --help" 2>&1 | tee /tmp/apprun-arch.log
              status="${PIPESTATUS[0]}"
              set -e
              # The exact failure we are guarding against.
              if grep -E "symbol lookup error|SharpYuvConvertWithOptions|undefined symbol" /tmp/apprun-arch.log; then
                echo "AppRun hit the libavif/libsharpyuv symbol error on Arch"
                exit 1
              fi
              if [ "${status}" != "0" ] && [ "${status}" != "124" ]; then
                echo "AppRun failed with status ${status} on Arch"
                exit "${status}"
              fi
            '


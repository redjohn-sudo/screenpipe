# screenpipe — AI that knows everything you've seen, said, or heard
# https://screenpipe.com
name: PR 7335 OCR budget follow-up
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr7335-ocr-budget-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    name: Native capture / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      GIT_LFS_SKIP_SMUDGE: 1
      SUBJECT_SHA: 0f44642ee1f810195367b3ded1075ac9af822462
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: 0f44642ee1f810195367b3ded1075ac9af822462
          path: source
      - name: Machine identity and native fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          { sw_vers; uname -a; sysctl hw.model hw.ncpu hw.memsize machdep.cpu.brand_string; csrutil status; } > evidence/machine.txt
          git -C source rev-parse HEAD > evidence/source-sha.txt
          git -C harness rev-parse HEAD > evidence/harness-sha.txt
          swiftc -O harness/scripts/cloud-benchmark/Fixture.swift -o fixture
          clang -O2 harness/scripts/cloud-benchmark/sample.c -o sample
          bash source/.github/scripts/macos/wrap-binary-as-app-bundle.sh fixture com.screenpipe.cloudbench.fixture CloudFixture "$PWD/CloudFixture.app"
          sudo bash source/scripts/tcc-grant/tcc-grant.sh grant --app "$PWD/CloudFixture.app" --service accessibility,input-monitoring,screen-recording --adhoc-sign
          PREFLIGHT_ONLY=1 python3 harness/scripts/cloud-benchmark/run.py "$PWD/evidence/preflight" "$PWD/fixture" "$PWD/CloudFixture.app/Contents/MacOS/CloudFixture" "$PWD/sample"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
          shared-key: pr7335-cloud-native-${{ matrix.os }}
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Dependencies
        run: brew install ffmpeg pkg-config || brew list ffmpeg pkg-config
      - name: Build matched release engines
        working-directory: source
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin e08fa22b93425806cc1a9dedcc8f56830cb51844
          for pair in before:e08fa22b93425806cc1a9dedcc8f56830cb51844 after:0f44642ee1f810195367b3ded1075ac9af822462; do
            label="${pair%%:*}"
            sha="${pair#*:}"
            git checkout "$sha"
            test "$(git rev-parse HEAD)" = "$sha"
            cargo build --locked --release -p screenpipe-engine --bin screenpipe --no-default-features --features redact-onnx-cpu
            bash .github/scripts/macos/wrap-binary-as-app-bundle.sh target/release/screenpipe "com.screenpipe.cloudbench.engine.$label" "CloudRecorder-$label" "$GITHUB_WORKSPACE/CloudRecorder-$label.app"
            sudo bash scripts/tcc-grant/tcc-grant.sh grant --app "$GITHUB_WORKSPACE/CloudRecorder-$label.app" --service accessibility,input-monitoring,screen-recording --adhoc-sign
            shasum -a 256 "$GITHUB_WORKSPACE/CloudRecorder-$label.app/Contents/MacOS/CloudRecorder-$label" > "$GITHUB_WORKSPACE/evidence/binary-$label.txt"
          done
          git checkout 0f44642ee1f810195367b3ded1075ac9af822462
      - name: Matched native workloads
        timeout-minutes: 55
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = arm64 ]; then order="before after"; else order="after before"; fi
          for label in $order; do
            if [ "$label" = before ]; then export SUBJECT_SHA=e08fa22b93425806cc1a9dedcc8f56830cb51844; else export SUBJECT_SHA=0f44642ee1f810195367b3ded1075ac9af822462; fi
            python3 harness/scripts/cloud-benchmark/run.py "$PWD/evidence/$label/benchmark" "$PWD/CloudRecorder-$label.app/Contents/MacOS/CloudRecorder-$label" "$PWD/CloudFixture.app/Contents/MacOS/CloudFixture" "$PWD/sample"
          done
      - name: Recording policy regression tests
        working-directory: source
        timeout-minutes: 30
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        run: |
          set -o pipefail
          cargo test --locked --profile debug-dev -p screenpipe-engine --lib --no-default-features --features redact-onnx-cpu recording_detail::tests 2>&1 | tee ../evidence/recording-detail-tests.log
          cargo test --locked --profile debug-dev -p screenpipe-engine --lib --no-default-features --features redact-onnx-cpu power:: 2>&1 | tee ../evidence/power-tests.log
          cargo test --locked --profile debug-dev -p screenpipe-capture --lib 2>&1 | tee ../evidence/capture-tests.log
          cargo test --locked --profile debug-dev -p screenpipe-db --lib deferred_ocr 2>&1 | tee ../evidence/queue-tests.log
          cargo test --locked --profile debug-dev -p screenpipe-db --test ui_events_batch_test 2>&1 | tee ../evidence/frame-link-tests.log
      - name: Evidence, including failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7335-${{ matrix.os }}-native-evidence
          path: |
            evidence/**/*.txt
            evidence/**/*.log
            evidence/**/fixture.stdout
            evidence/**/*.json
            evidence/**/*.jsonl
            evidence/**/database-snapshot.sqlite
            evidence/**/*.jpg
            evidence/**/*.jpeg
            evidence/**/*.png
          retention-days: 14
